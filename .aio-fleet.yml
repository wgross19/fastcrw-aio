schema_version: 1
repo: fastcrw-aio
github_repo: wgross19/fastcrw-aio
app_slug: fastcrw-aio
image:
  name: dub19/fastcrw-aio
  cache_scope: fastcrw-aio-image
  pytest_tag: fastcrw-aio:pytest
  publish_platforms: linux/amd64
release:
  name: fastcrw AIO
  profile: changelog-version
  previous_tag_command: latest-aio-tag
upstream:
  name: crw
  version_key: CRW_VERSION
  digest_arg: UPSTREAM_IMAGE_DIGEST
  monitor:
    - component: crw
      name: crw
      source: github-tags
      repo: us/crw
      dockerfile: Dockerfile
      version_key: CRW_VERSION
      tarball_sha_key: CRW_TARBALL_SHA256
      stable_only: true
      strategy: pr
      release_notes_url: https://github.com/us/crw/releases
template:
  xml_paths:
    - fastcrw-aio.xml
  generated: false
catalog:
  published: true
  assets:
    - source: fastcrw-aio.xml
      target: fastcrw-aio.xml
    - source: assets/app-icon.png
      target: icons/fastcrw-aio.png
tests:
  unit: tests -m "not integration"
  integration: tests/integration -m integration --timeout=600
  checkout_submodules: false
