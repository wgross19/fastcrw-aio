# AIO-specific overrides (layered on top of config.default.toml).
#
# This is the in-repo bundle matching the upstream reference deployment
# (/docker-compose/fastcrw, where the file is mounted at /app/config.docker.toml),
# tuned for the single-container fastcrw-aio image:
#   * LightPanda runs IN-CONTAINER on 127.0.0.1:9222 (no compose hostname).
#   * Chrome is NOT bundled by default — the heavy Chrome tier is opt-in.
#   * SearXNG is an EXTERNAL dependency; there is no bundled sidecar.
#
# Env vars always win over this file (crw-server applies CRW_* overrides on
# top of the loaded TOML). The XML template exposes these as fields:
#   CRW_SEARCH__SEARXNG_URL  (required for /v1/search + research)
#   CRW_RENDERER__MODE       (renderer toggle)
#   CRW_SERVER__PORT
# Keep the values below as the documented defaults; operators override via env.

[request]
# Bench analysis (May 2026): 12 of 14 zero-byte misses on the 150-URL diagnose
# bench were hitting the default 8s deadline cap (latency ~8000ms,
# structural_failure: 0 bytes with HTTP 200) — chrome had loaded but
# post-navigate snapshot was killed mid-flight. clover.com confirms a 30s
# deadline yields a 264kb response. 15s is the budget that recovers the
# stragglers without ballooning p50 on healthy pages.
deadline_ms_default = 15000
# Issue #35: when an implicit request omits `deadlineMs`, auto-extend the
# effective deadline to `max(deadline_ms_default, ladder_min)` where
# ladder_min = sum(per-tier timeouts) + N_cdp_tiers * 28s. Prevents
# `chrome_timeout_ms = 30000` from appearing inert when this default is
# small. Set to false to enforce the strict 15s SLO regardless of tier
# sizing — explicit per-request `deadlineMs` always wins either way.
auto_extend_deadline_for_ladder = true

[server]
# Disable global rps cap for benchmark + production load — the bench fires
# 8-concurrency for 5-10s and gets rate-limited at the default 10 rps.
# Per-host rps (eTLD+1) is still enforced via the crawler limiter.
rate_limit_rps = 0

[renderer]
# Per-tier nav timeouts. Bench analysis (April 2026): the flat 30s budget
# pushed slow gov/legal SPAs to client_timeout in chrome (~6 URLs) while
# letting the http tier monopolize 30s of budget on stalled origins. Splitting
# 15/20/45 lets HTTP fail fast into the JS escalation while giving Chrome
# enough headroom for `networkidle` on heavy pages.
http_timeout_ms = 4000
# LightPanda bounded tight so chrome always has >=3s residual under the 8s
# deadline. LP is flaky on heavy SPAs (segfaults, CDP closes mid-eval).
lightpanda_timeout_ms = 2500
chrome_timeout_ms = 30000

# Phase 2: chrome request interception. Pump blocks images/media/fonts/
# manifests/websockets + analytics/ads/session-replay hosts via
# Fetch.requestPaused. Cuts subresource volume by ~50% on commercial pages.
chrome_intercept_resources = true
# Hard ceiling for chrome post-navigate phase. Inner race; on hit a
# partial-DOM snapshot is returned with truncated=true.
chrome_nav_budget_ms = 12000

# Post-navigate challenge retry loop, cut from the default 3 to 1.
# A/B measured 2026-06-21: scrape-success 90% -> 90%, truth-recall flat,
# median markdown +4%, p90 -15% (20231 -> 20314ms->20314... see upstream).
# Not set to 0 (Firecrawl-style) deliberately: 1 still clears a challenge
# that resolves on the first re-check.
chrome_challenge_max_retries = 1

# Phase 4 §B5: bounded browser-context pool. Backend explicitly vanilla —
# pool is gated off on browserless via lib.rs.
chrome_backend = "vanilla"
chrome_context_pool_enabled = true

# LightPanda runs IN-CONTAINER in the AIO bundle on 127.0.0.1:9222.
# crw-server reaches it directly; there is no compose hostname to rewrite.
[renderer.lightpanda]
ws_url = "ws://127.0.0.1:9222/"

# Chrome is NOT bundled by default. To add an external CDP renderer (e.g. a
# headless-shell sidecar), uncomment this and set an endpoint reachable from
# the container, then set the renderer mode via CRW_RENDERER__MODE.
# [renderer.chrome]
# ws_url = "ws://chrome:9222/"

# Phase A (latency-qn): the browser-CONTEXT pool. Pair with a chrome mem_limit
# sized for the pool. This AIO bundle does not ship Chrome by default, so the
# pool stays dormant unless a chrome tier is added above.
[renderer.chrome_pool]
size = 8
# Interactive render reserve (B lane): of the 8-slot pool, guarantee 3 slots
# for interactive single /scrape so one tenant's batch/crawl can't squeeze
# others below 3 (batch keeps 8-3=5).
reserved_interactive_renders = 3

# /v1/search + research endpoints need an EXTERNAL SearXNG instance. There is
# no bundled sidecar in the single-container AIO. Point CRW at one by setting
# CRW_SEARCH__SEARXNG_URL=http://your-host:8080 (env wins over this file).
# When unset, /v1/search returns 503 search_disabled; scrape/crawl/map/extract
# work without it.
[search]
# searxng_url = "http://your-searxng-host:8080"
# Multi-query expansion (cycle-2 of the answer-quality loop): the proven win.
# On a 50-q SimpleQA+FRAMES sample it lifted overall 64%->76% and FRAMES
# 56%->80% by unioning an entity-rewrite's results with the original.
query_expand = true
# Multi-variant query expansion (recall lever). n=1 -> n=3 lifted accuracy
# 80%->88% and truthfulness on a 25-q SimpleQA sample.
query_expand_variants = 3
# Calibrated answer path (the proven over-abstention fix). On a 152-q set it
# lifted overall 81.6%->~85% with abstentions converting 1:1 to correct.
answer_calibrated = true

# /map URL filter — defaults on. Set `drop_action_urls = false` to revert
# to legacy behaviour (action URLs surface in results).
[map.url_filter]
strip_tracking_params = true
drop_action_urls = true
gov_tld_drop_actions = false

# Document (PDF) parsing — see config.default.toml for field docs.
[document]
enabled = true
max_pages = 0
attempt_scanned = false
max_upload_bytes = 52428800
upload_concurrency = 2
# Sized so concurrent sandbox children fit the container mem_limit (2g):
# 2 x sandbox_memory_bytes (512 MiB) + engine base ~ 1.3 GiB < 2 GiB.
max_concurrent_parses = 2
parse_timeout_ms = 30000
max_decompressed_bytes = 104857600
# Docker images accept untrusted uploads -> isolate parses by default.
sandbox = true
sandbox_memory_bytes = 536870912
